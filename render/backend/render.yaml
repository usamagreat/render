services:
  - type: web
    name: safewatch-relay
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: SAFEWATCH_TOKEN
        value: safewatch2024   # ← CHANGE THIS to a strong secret before going live
      - key: PORT
        generateValue: false
    autoDeploy: true
